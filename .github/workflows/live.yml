name: live

on:
  schedule:
    - cron: "5 */5 * * *"   # новый запуск каждые 5 часов, пока предыдущий ещё идёт, он ждёт в очереди
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run live bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live.py
