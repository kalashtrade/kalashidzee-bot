name: optimize

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Сколько дней истории"
        default: "270"

jobs:
  opt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python optimize.py --days ${{ github.event.inputs.days }}
      - uses: actions/upload-artifact@v4
        with:
          name: optimize-results
          path: optimize_results.csv
